<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gaire Kitchen — Admin login</title><link rel="stylesheet" href="dashboard.css"><link rel="stylesheet" href="login.css"></head><body><main class="login-page"><div class="login-card"><a class="brand" href="index.html"><span class="brand-mark">GK</span><span>gaire<br><em>kitchen</em></span></a><p class="kicker">Admin workspace</p><h1>Welcome back.</h1><p class="subhead">Sign in to view orders and restaurant activity.</p><form id="adminLogin"><label>Admin ID<input id="adminId" required autocomplete="username"></label><label>Password<div class="password-wrap"><input id="adminPassword" required type="password" autocomplete="current-password"><button type="button" class="password-eye" id="togglePassword" aria-label="Show password">◉</button></div></label><button class="export-button" type="submit">Sign in <span>↗</span></button><p class="login-error" id="loginError">Incorrect admin ID or password.</p></form></div></main><script>document.getElementById('adminLogin').onsubmit=e=>{e.preventDefault();if(document.getElementById('adminId').value==='Gaire web'&&document.getElementById('adminPassword').value==='12345678'){sessionStorage.setItem('gaire_admin_auth','true');location.href='dashboard.html'}else document.getElementById('loginError').classList.add('show')};const pw=document.getElementById('adminPassword'),eye=document.getElementById('togglePassword');eye.onclick=()=>{const show=pw.type==='password';pw.type=show?'text':'password';eye.textContent=show?'◎':'◉';eye.setAttribute('aria-label',show?'Hide password':'Show password')};</script></body></html>
